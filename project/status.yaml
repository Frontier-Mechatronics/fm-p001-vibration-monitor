# FM-P001 — machine-readable project state.
#
# This file is the SINGLE canonical statement of where the project currently is.
# Anything that duplicates it elsewhere is a defect (see AGENTS.md §11).
# Update it in the same change that alters project state.
#
# Schema notes:
#   - Keep this file short. It is pasted into architecture reviews verbatim.
#   - IDs reference artifacts elsewhere; this file never restates their content.
#   - `gate.status` is one of: not_started | in_progress | ready_for_review | passed
#   - Only the human engineering lead may set a gate to `passed` (AGENTS.md §5).

schema_version: 1
harness_version: "0.1"

# FM-P001 — machine-readable project state.
#
# This file is the SINGLE canonical statement of where the project currently is.
# Anything that duplicates it elsewhere is a defect (see AGENTS.md §11).
# Update it in the same change that alters project state.
#
# Schema notes:
#   - Keep this file short. It is pasted into architecture reviews verbatim.
#   - IDs reference artifacts elsewhere; this file never restates their content.
#   - `gate.status` is one of: not_started | in_progress | ready_for_review | passed
#   - Only the human engineering lead may set a gate to `passed` (AGENTS.md §5).

schema_version: 1
harness_version: "0.1"
updated: 2026-09-05          # ISO-8601 date, updated on every state change

product:
  program: Frontier Mechatronics
  product_id: FM-P001
  family: SV
  model: SV1
  working_name: Construction Vibration & Edge Intelligence Monitor

phase: G1 - sensor acquisition

gate:
  current: G1
  title: Sensor acquisition
  file: project/gates/G1-sensor-acquisition.md
  status: in_progress             # set by Claude; only the human sets `passed`
  next: G2
  previous: G0                    # passed 2026-09-05; outcome in its own gate file

objective:
  summary: >-
    Demonstrate with physical evidence that a real accelerometer can be read by real
    firmware at a known, independently measured sample rate.
  definition_of_done: >-
    G1 pass criteria agreed and satisfied, with accepted physical evidence for every
    criterion that depends on physical behaviour.
  note: >-
    G1 pass criteria are NOT yet agreed (DQ-004). The bench inventory now makes them
    writable; bench execution additionally waits on ADXL355 delivery.

experiment:
  active: null                    # e.g. EXP-0001; null while no experiment is running
  note: >-
    EXP-0001 is not drafted. The architecture review recommends it answer one narrow
    question -- whether existing bench hardware can produce a continuous three-axis stream
    whose actual sample timing can be independently measured and reconciled with the
    firmware record. Drafting waits on the inventories.

# Requirement IDs in scope for the current gate. All remain `draft`; being in scope
# means G1 must produce evidence about them, not that they are accepted.
active_requirements:
  - SV-ACQ-001                    # continuous 3-axis acquisition
  - SV-ACQ-002                    # nominal sample rate (1 kHz is an EXPERIMENTAL target)
  - SV-SYS-002                    # measurement provenance

blockers: []                      # things preventing progress; empty is normal

decisions_required:               # open questions needing a human/architect decision
  - id: DQ-001
    question: Is the SV family / SV1 model naming confirmed for requirement IDs, or
      provisional pending a product-naming decision?
    owner: human
    blocking: false
  - id: DQ-002
    status: resolved
    resolved: 2026-09-05
    question: >-
      Which accelerometer and MCU hardware is available? Resolved as an INVENTORY, not a
      selection: see hardware/inventory.md. Nucleo F411RE is the preferred experimental
      host; 3x EVAL-ADXL355-PMDZ are on order. No ADR selects either; the R-024 checkpoint
      before G2 tests whether that has held in practice.
    owner: human
    blocking: false
  - id: DQ-003
    question: >-
      What sample-interval variation (jitter) is acceptable? Must be derived from the
      intended DSP, not chosen now. May remain open through G1 and be answered by G3.
    owner: architect
    blocking: false
  - id: DQ-004
    question: >-
      G1 pass criteria are not yet agreed. The bench inventory now makes them writable.
      Agree them with the architect before EXP-0001 is drafted.
    owner: architect + human
    blocking: true                # blocks EXP-0001 drafting
  - id: DQ-005
    question: >-
      The primary oscilloscope is a two-channel instrument (manufacturer specification).
      DRDY plus a GPIO marker consumes both channels, leaving none for SPI chip-select or
      clock. Does EXP-0001 need simultaneous bus observation, or can it proceed with
      separate captures using different probe arrangements?
    owner: architect + human
    blocking: false               # affects experiment design, not readiness to draft

human_actions_required:
  - id: HA-002
    status: substantially_resolved
    action: >-
      Inventory the accelerometer and MCU hardware physically available. MCU side resolved
      (hardware/inventory.md). Sensor side ORDERED BUT NOT DELIVERED -- 3x
      EVAL-ADXL355-PMDZ. Remains open until the boards are physically in hand.
    blocking: false               # no longer blocks planning; blocks bench work
  - id: HA-003
    status: resolved
    resolved: 2026-09-05
    action: >-
      Inventory the measurement instruments. Resolved for G1 planning: Siglent SDS1202X-E
      primary, HDS272S secondary, Rigol DP932E supply, no logic analyser (deferred, and
      not a G1 blocker). See hardware/inventory.md.
    blocking: false
  - id: HA-004
    status: partially_resolved
    action: >-
      Stimulus and mounting. STIMULUS RESOLVED: 3x Vybronics VC1020B111F ERM motors on
      order, providing controlled repeatable excitation (not a magnitude reference).
      MOUNTING REMAINS OPEN -- how the sensor is attached to the excited structure is
      unresolved, and is a G2 measurement-system concern that G1 must work around rather
      than solve.
    blocking: false

  - id: HA-005
    action: >-
      Record instrument serial numbers or asset IDs and calibration state in
      hardware/inventory.md. Currently `unknown`. Required by experiments/evidence.md
      before any evidence manifest can be completed -- fill before measuring, not after.
    blocking: false               # blocks evidence recording, not experiment drafting

latest_accepted_evidence: []      # evidence IDs accepted by the human engineering lead

next_proposed_actions:
  - Agree G1 pass criteria with the architect (DQ-004), now that the bench inventory makes
    them writable.
  - Draft EXP-0001 around the acquisition-timing question, once criteria are agreed and
    subject to human direction. Bench execution waits on ADXL355 delivery.
  - Record instrument serials and calibration state (HA-005) before any evidence is taken.
  - >-
    R-024 dependency control (project/risks.md) is now two-part: classify at the moment a
    board- or sensor-specific dependency spreads beyond EXP-0001 support (event trigger, not
    a cadence), with the mandatory before-G2 checkpoint as backstop. Each dependency is
    recorded as disposable, an explicit experiment constraint, or needing an ADR /
    comparative experiment.
  - >-
    Claude to add Codex's event-triggered R-024 classification before G1-specific
    dependencies are reused or retained (MSG-20260905T032805Z-c949-codex), then reply.

open_scope_notes:
  - Sensor, MCU, radio, gateway platform and cloud platform are candidates only. No
    component or platform decision has been made (see docs/decisions/README.md).
  - >-
    Harness amended during G0 review: an append-only inter-agent coordination ledger was
    added at project/coordination/ (AGENTS.md section 14), proposed by Codex and adopted
    with four amendments. Recorded as an amendment rather than folded into the original
    G0 scope; see project/gates/G0-project-definition.md.
  - >-
    1 kHz is an EXPERIMENTAL TARGET for G1, not a derived product requirement. The
    architecture review is explicit that a sampling requirement must follow from the
    measurement bandwidth the application needs, and must not be back-derived from what
    convenient hardware happens to achieve.
  - >-
    Architecture actions deferred to later gates are recorded in project/roadmap.md so
    they attach to the gate that must satisfy them.
  - >-
    Bench hardware is recorded once, in hardware/inventory.md. The Nucleo F411RE is an
    EXPERIMENT HOST and the EVAL-ADXL355-PMDZ an EXPERIMENT PLATFORM. No ADR selects an MCU
    family or sensor for SV1. The earlier claim that experimental use "commits the product
    to nothing" was rejected in review as untestable; whether lock-in has occurred is
    decided by the R-024 checkpoint in project/risks.md, which runs before G2 opens.
  - >-
    Nothing physical has been measured by this project. Every hardware specification on
    record is manufacturer documentation, i.e. `predicted`, not measured.
